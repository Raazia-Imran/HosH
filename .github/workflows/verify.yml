name: Website verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global bun@1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun audit
      - run: bun run build
        env:
          NITRO_PRESET: node-server
      - name: Verify production routes and security headers
        run: |
          PORT=4186 HOST=127.0.0.1 node .output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<40;i++){try{const r=await fetch("http://127.0.0.1:4186");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          BASE_URL=http://127.0.0.1:4186 CHECK_SECURITY=1 node scripts/check-site.mjs
